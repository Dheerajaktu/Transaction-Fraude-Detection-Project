spring.application.name=transactionProcessing
debug=true

#MySQL Connection Setting
spring.datasource.url=jdbc:mysql://localhost:3306/hackethon 
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. APACHE KAFKA CONFIGURATION
# ===================================================================

# Kafka Brokers Connection String
spring.kafka.bootstrap-servers=localhost:9092

# Producer Config: Key will be String and value will convert into JSON automatic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Consumer Config: Key Would be in sting and Value JSON will convert into object
spring.kafka.consumer.group-id=transction-fraud-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# Crucial Setup: It tells to spring packages are safe for JSON parsing
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Default fallback pattern config (If in case payload couldn't map)
spring.kafka.consumer.properties.spring.json.value.default.type=com.hackethon.app.dto.TransactionEvent




